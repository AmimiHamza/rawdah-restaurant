<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#121212"/>
  <!-- Gold border -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Letter R -->
  <text
    x="32"
    y="47"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="40"
    font-weight="400"
    fill="#D4AF37"
    text-anchor="middle"
    letter-spacing="1"
  >R</text>
  <!-- Thin gold underline accent -->
  <line x1="18" y1="54" x2="46" y2="54" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
</svg>
